[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "flutter-supply-guard"
version = "0.1.0"
description = "Read-only Flutter, Android and iOS dependency supply-chain checks"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
flutter-supply-guard = "supply_guard.cli:main"

[tool.setuptools.packages.find]
include = ["supply_guard*"]
